name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          uv pip install -e .

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Verify synthetic pipeline and future-data invariance
        run: make fixture
