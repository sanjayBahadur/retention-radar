[project]
name = "retention-radar"
version = "0.1.0"
description = "Retail customer-retention analytics: Markov chains, CLV, ML churn, uplift modeling and marketing attribution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.0",
    "dbt-core>=1.12.0,<2.0.0",
    "dbt-duckdb>=1.8.0",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
    "lifelines>=0.29.0",
    "pymc-marketing>=1.3.0",
    "causalml>=0.18.0",
    "statsmodels>=0.14.0",
    "mlxtend>=0.23.0",
    "networkx>=3.2.0",
    "pandera>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "kaggle>=1.6.0",
    "jinja2>=3.1.3",
    "openpyxl>=3.1.2",
    "ucimlrepo>=0.0.6",
    "six>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "nbstripout>=0.7.1",
    "jupyter>=1.0.0",
]
polish = [
    "mlflow>=2.14.0",
    "dagster>=1.7.0",
    "dagster-dbt>=0.23.0",
    "dagster-webserver>=1.7.0",
    "hmmlearn>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "integration: integration tests",
]
addopts = "-ra -q --cov=src --cov-report=term-missing"
